
<h1>Create Your Ajo Account</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Create Account</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'accounts:login' %}">Login</a>
</p>
