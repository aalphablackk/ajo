
<h1>Login to Your Account</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>

<p>
    Don't have an account?
    <a href="{% url 'accounts:register' %}">Register</a>
</p>
